# NOTE: For real deployments, do NOT commit real secrets to git.
# Prefer AWS Secrets Manager + External Secrets Operator, or `kubectl create secret`
# from CI with values pulled from a vault. This file is a placeholder for local/demo use.
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: blogapp
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "REPLACE_WITH_STRONG_ROOT_PASSWORD"
  MYSQL_DATABASE: "blogdb"
  MYSQL_USER: "bloguser"
  MYSQL_PASSWORD: "REPLACE_WITH_STRONG_APP_PASSWORD"
