apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: blogapp
data:
  PORT: "5000"
  DB_HOST: "mysql-service"
  DB_PORT: "3306"
  DB_NAME: "blogdb"
  CORS_ORIGIN: "*"
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: blogapp
type: Opaque
stringData:
  DB_USER: "bloguser"
  DB_PASSWORD: "REPLACE_WITH_STRONG_APP_PASSWORD"
  JWT_SECRET: "REPLACE_WITH_LONG_RANDOM_STRING"
